<!-- Bubbler+ mark.
     A balloon on its leader above a dimension line: the two things the app is
     about, in the fewest strokes that still read at 24px.
     Deliberately NOT a circle with a 45-degree leader — that silhouette is a
     magnifying glass long before it is a balloon.
     currentColor throughout, so one file serves the dark rail and a light icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <g opacity=".55" stroke-width="4.5">
      <path d="M26 94h68"/>
      <path d="M26 86v16M94 86v16"/>
    </g>
    <path d="M60 58v20" stroke-width="5.5"/>
    <circle cx="60" cy="40" r="21" stroke-width="7"/>
  </g>
</svg>
